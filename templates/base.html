<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahsan AI Workspace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light" disabled>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}?v=9">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}?v=9">
</head>
<body>
  {% block content %}{% endblock %}

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script>
    window.__WORKSPACE__ = {{ app_bootstrap|default({})|tojson }};
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/markdown.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/sidebar.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=9"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=9"></script>
</body>
</html>
